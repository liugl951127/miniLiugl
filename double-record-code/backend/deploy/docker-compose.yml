version: '3.8'

# 双录一体化平台 - 一键启动(开发/测试环境)
# 包含: MySQL + Redis + Backend + 4 Peer 联盟链 + Orderer

networks:
  dual-record-net:
    driver: bridge

services:
  # ============================================================
  # MySQL
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: dual-record-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_2026
      MYSQL_DATABASE: dual_record
      MYSQL_USER: dual_record
      MYSQL_PASSWORD: dual_record_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    networks: [dual-record-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdual_record_2026"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: dual-record-redis
    ports:
      - "6379:6379"
    networks: [dual-record-net]

  # ============================================================
  # Backend
  # ============================================================
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dual-record/backend:1.0.0
    container_name: dual-record-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_PASSWORD: dual_record_2026
      REDIS_PASSWORD: ""
      JWT_SECRET: dual_record_jwt_secret_2026_at_least_32_chars
      SM4_KEY: 0123456789abcdeffedcba9876543210
      FABRIC_WALLET_PATH: /opt/fabric/wallet
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks: [dual-record-net]

volumes:
  mysql-data:

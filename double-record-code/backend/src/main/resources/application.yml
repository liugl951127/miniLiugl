server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dual-record-backend
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  datasource:
    url: jdbc:mysql://localhost:3306/dual_record?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: dual_record
    password: ${DB_PASSWORD:dual_record_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bank.dualrecord.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted_at
      logic-delete-value: NOW()
      logic-not-delete-value: null
    banner: false

# Fabric 区块链配置
fabric:
  enabled: true
  msp-id: BankMSP
  channel: dual-record-channel
  chaincode: dual-record-chaincode
  network-config-path: classpath:fabric/connection-profile.yaml
  wallet-path: ${FABRIC_WALLET_PATH:./wallet}
  identity-label: admin
  # 链码异步事件监听
  event-listener:
    enabled: true
    poll-interval: 1000

# 国密配置
crypto:
  sm4-key: ${SM4_KEY:0123456789abcdeffedcba9876543210}
  sm3-enabled: true

# JWT
jwt:
  secret: ${JWT_SECRET:dual_record_jwt_secret_2026_at_least_32_chars}
  expiration: 7200  # 2 小时
  refresh-expiration: 604800  # 7 天
  issuer: dual-record-platform

# 业务参数
dual-record:
  session-timeout-minutes: 60
  max-retries: 3
  video-max-size-mb: 500
  auto-archive-days: 365
  block-chain-event-async: true

# LLM AI 质检配置
llm:
  primary: qwen
  fallback: deepseek
  qwen:
    api-key: ${QWEN_API_KEY:}
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-max
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    endpoint: https://api.deepseek.com/v1
    model: deepseek-chat

# Kafka 配置
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: chain-event-consumer
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    acks: all
    retries: 3
    properties:
      enable.idempotence: true

# WebRTC SFU 配置
webrtc:
  sfu-url: ${SFU_URL:wss://sfu.bank.com/ws}
  ice-servers:
    - urls: stun:stun.l.google.com:19302

# 银保监报送
csrc:
  institution-code: ${CSRC_INSTITUTION_CODE:BANK0001}
  institution-name: ${CSRC_INSTITUTION_NAME:XX 银行}
  report-path: /opt/dual-record/csrc-report/

# 日志
logging:
  level:
    root: INFO
    com.bank.dualrecord: DEBUG
    org.hyperledger.fabric: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

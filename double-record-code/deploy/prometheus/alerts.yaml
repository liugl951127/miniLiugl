# 双录一体化平台 - Prometheus 告警规则
# 加载方式:kubectl apply -f alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dual-record-alerts
  labels:
    app: dual-record
    prometheus: bank-monitoring
spec:
  groups:
    # ============================================================
    # 应用层告警
    # ============================================================
    - name: dual_record_application
      interval: 30s
      rules:
        - alert: ApplicationDown
          expr: up{job="dual-record-backend"} == 0
          for: 1m
          labels:
            severity: critical
            team: ops
          annotations:
            summary: "双录平台应用不可用"
            description: "Pod {{ $labels.pod }} 已宕机超过 1 分钟"
            runbook: "kubectl describe pod -n dual-record-prod {{ $labels.pod }}"

        - alert: HighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (uri)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (uri) > 0.05
          for: 5m
          labels:
            severity: warning
            team: dev
          annotations:
            summary: "5xx 错误率超过 5%"
            description: "接口 {{ $labels.uri }} 错误率 {{ $value | humanizePercentage }}"

        - alert: SlowResponse
          expr: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (uri, le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "P95 响应时间 > 1s"
            description: "{{ $labels.uri }} P95 = {{ $value }}s"

        - alert: HighGC
          expr: |
            rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            team: dev
          annotations:
            summary: "JVM GC 暂停频繁"
            description: "GC 总暂停时间 {{ $value }}s/s,可能存在内存泄漏"

        - alert: OOMKilled
          expr: |
            increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[1h]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Pod OOM 被杀"
            description: "{{ $labels.pod }} 在过去 1 小时内因 OOM 被杀 {{ $value }} 次"

    # ============================================================
    # JVM 告警
    # ============================================================
    - name: dual_record_jvm
      interval: 30s
      rules:
        - alert: HighHeapUsage
          expr: |
            jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
          for: 5m
          labels:
            severity: warning
            team: dev
          annotations:
            summary: "JVM 堆使用率 > 85%"
            description: "堆使用 {{ $value | humanizePercentage }},考虑扩容或调优"

        - alert: FullGCPause
          expr: |
            jvm_gc_pause_seconds_max{cause="Full GC"} > 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Full GC 暂停 > 500ms"

        - alert: ThreadDeadlock
          expr: jvm_threads_deadlocked > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "检测到线程死锁"
            description: "{{ $value }} 个线程死锁,需立即 dump"

    # ============================================================
    # 数据库告警
    # ============================================================
    - name: dual_record_database
      interval: 30s
      rules:
        - alert: MysqlDown
          expr: mysql_up == 0
          for: 1m
          labels:
            severity: critical
            team: dba
          annotations:
            summary: "MySQL 主库不可用"
            runbook: "https://wiki.bank.com/runbook/mysql-down"

        - alert: MysqlReplicationLag
          expr: mysql_slave_status_seconds_behind_master > 30
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "MySQL 复制延迟 > 30s"
            description: "延迟 {{ $value }} 秒"

        - alert: MysqlConnectionsHigh
          expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MySQL 连接数 > 80%"

        - alert: MysqlSlowQueries
          expr: |
            increase(mysql_global_status_slow_queries[5m]) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "5 分钟内慢查询 > 100"

    # ============================================================
    # Redis 告警
    # ============================================================
    - name: dual_record_redis
      interval: 30s
      rules:
        - alert: RedisDown
          expr: redis_up == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Redis 不可用"
            runbook: "业务自动降级,但需立即修复"

        - alert: RedisMemoryHigh
          expr: |
            redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis 内存 > 90%"

        - alert: RedisRejectedConnections
          expr: increase(redis_rejected_connections_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Redis 拒绝连接(可能内存满)"

    # ============================================================
    # Kafka 告警
    # ============================================================
    - name: dual_record_kafka
      interval: 30s
      rules:
        - alert: KafkaConsumerLag
          expr: kafka_consumer_lag_max > 10000
          for: 5m
          labels:
            severity: warning
            team: dev
          annotations:
            summary: "Kafka 消费积压"
            description: "topic={{ $labels.topic }} 积压 {{ $value }} 条"

        - alert: KafkaConsumerLagCritical
          expr: kafka_consumer_lag_max > 100000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Kafka 严重积压"
            runbook: "检查消费者是否健康 / 扩容"

        - alert: KafkaUnderReplicated
          expr: kafka_topic_partition_in_sync_replica < kafka_topic_partition_replica_count
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka 分区副本不足"

    # ============================================================
    # Fabric 告警
    # ============================================================
    - name: dual_record_fabric
      interval: 1m
      rules:
        - alert: FabricPeerDown
          expr: up{job="fabric-peer"} == 0
          for: 2m
          labels:
            severity: critical
            team: blockchain
          annotations:
            summary: "Fabric Peer 节点宕机"
            description: "组织 {{ $labels.org }} Peer {{ $labels.peer }} 不可用"

        - alert: FabricOrdererDown
          expr: up{job="fabric-orderer"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Fabric Orderer 不可用"

        - alert: FabricEndorsementFailure
          expr: |
            increase(fabric_chaincode_proposals_failed_total[5m]) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "链码提案失败率上升"

        - alert: FabricBlockTimeHigh
          expr: fabric_block_commit_duration_seconds > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fabric 出块时间 > 2s"

    # ============================================================
    # K8s 资源告警
    # ============================================================
    - name: dual_record_k8s
      interval: 30s
      rules:
        - alert: PodMemoryHigh
          expr: |
            container_memory_usage_bytes{pod=~"dual-record-.*"} / 
            container_spec_memory_limit_bytes{pod=~"dual-record-.*"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod 内存 > 85% 限制"
            description: "{{ $labels.pod }} 内存使用率 {{ $value | humanizePercentage }}"

        - alert: PodCPUHigh
          expr: |
            rate(container_cpu_usage_seconds_total{pod=~"dual-record-.*"}[5m]) > 1.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod CPU > 1.5 核"

        - alert: HpaMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "HPA 已达最大副本数"
            description: "考虑手动扩容或优化性能"

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: ops
          annotations:
            summary: "K8s 节点 NotReady"
            runbook: "kubectl describe node {{ $labels.node }}"

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dual-record.fullname" . }}-config
  labels:
    {{- include "dual-record.labels" . | nindent 4 }}
data:
  application.yml: |-
    server:
      port: 8080
      servlet:
        context-path: /

    spring:
      application:
        name: dual-record-backend
      profiles:
        active: prod
      jackson:
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: GMT+8
      data:
        redis:
          host: ${REDIS_HOST:dual-record-redis}
          port: ${REDIS_PORT:6379}
          password: ${REDIS_PASSWORD:}
          timeout: 5s
      datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dual_record}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:dual_record}
        password: ${DB_PASSWORD}

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          show-details: when_authorized
        prometheus:
          enabled: true
      metrics:
        tags:
          application: ${spring.application.name}
          pod: ${POD_NAME}
          namespace: ${POD_NAMESPACE}

    actuator:
      allowed-ips: 127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12

    rate-limit:
      enabled: true
      login: 5
      captcha: 3
      write: 30
      read: 120

    mybatis-plus:
      configuration:
        map-underscore-to-camel-case: true
      global-config:
        db-config:
          id-type: ASSIGN_ID
          logic-delete-field: deleted_at

    fabric:
      enabled: true
      msp-id: BankMSP
      channel: dual-record-channel
      chaincode: dual-record-chaincode

    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_32_CHARS_RANDOM}
      expiration: 7200
      issuer: dual-record-platform

    spring.kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: chain-event-consumer
        auto-offset-reset: earliest
        enable-auto-commit: false

    logging:
      level:
        root: INFO
        com.bank.dualrecord: INFO
      pattern:
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

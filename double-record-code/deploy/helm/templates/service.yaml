apiVersion: v1
kind: Service
metadata:
  name: {{ include "dual-record.fullname" . }}
  labels:
    {{- include "dual-record.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: jmx
      protocol: TCP
      name: jmx
  selector:
    {{- include "dual-record.selectorLabels" . | nindent 4 }}

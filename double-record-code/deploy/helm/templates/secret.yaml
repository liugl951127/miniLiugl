apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dual-record.fullname" . }}-secret
  labels:
    {{- include "dual-record.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  db-password: {{ .Values.secrets.dbPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  qwen-api-key: {{ .Values.secrets.qwenApiKey | quote }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | quote }}
  sm4-key: {{ .Values.secrets.sm4Key | quote }}

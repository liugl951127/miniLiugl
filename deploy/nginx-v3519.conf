# =============================================================
# MiniMax Platform V3.5.19 Nginx 配置 (单文件 13 服务路由)
# 部署: cp deploy/nginx-v3519.conf /etc/nginx/conf.d/minimax.conf
# 端口: 80 (host) → 各微服务
# =============================================================

# 上游 (Upstream) - 13 个微服务
upstream minimax-gateway    { server 127.0.0.1:7080; keepalive 32; }
upstream minimax-auth       { server 127.0.0.1:8081; keepalive 16; }
upstream minimax-chat       { server 127.0.0.1:8082; keepalive 16; }
upstream minimax-model      { server 127.0.0.1:8084; keepalive 16; }
upstream minimax-rag        { server 127.0.0.1:8085; keepalive 16; }
upstream minimax-multimodal { server 127.0.0.1:8087; keepalive 16; }
upstream minimax-agent      { server 127.0.0.1:8088; keepalive 16; }
upstream minimax-monitor    { server 127.0.0.1:8089; keepalive 16; }
upstream minimax-admin      { server 127.0.0.1:8090; keepalive 16; }
upstream minimax-analytics  { server 127.0.0.1:8092; keepalive 16; }
upstream minimax-pipeline   { server 127.0.0.1:8093; keepalive 16; }
upstream minimax-ai         { server 127.0.0.1:8094; keepalive 16; }
upstream minimax-ws         { server 127.0.0.1:8095; keepalive 32; }

# 主 server (单端口 80 入口)
server {
    listen      80 default_server;
    server_name _;
    charset     utf-8;

    # 客户端最大 body (上传文件 100MB)
    client_max_body_size 100m;

    # 通用代理参数
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ===== 业务微服务 (按路径前缀) =====
    location /api/v1/auth/       { proxy_pass http://minimax-auth;       }
    location /api/v1/chat/       { proxy_pass http://minimax-chat;       }
    location /api/v1/memory/     { proxy_pass http://minimax-chat;       }  # V3.5.18 合并到 chat
    location /api/v1/model/      { proxy_pass http://minimax-model;      }
    location /api/v1/prompts/    { proxy_pass http://minimax-model;      }  # V3.5.18 合并到 model
    location /api/v1/rag/        { proxy_pass http://minimax-rag;        }
    location /api/v1/multimodal/ { proxy_pass http://minimax-multimodal; }
    location /api/v1/agent/      { proxy_pass http://minimax-agent;      }
    location /api/v1/monitor/    { proxy_pass http://minimax-monitor;    }
    location /api/v1/admin/      { proxy_pass http://minimax-admin;      }
    location /api/v1/analytics/  { proxy_pass http://minimax-analytics;  }
    location /api/v1/pipeline/   { proxy_pass http://minimax-pipeline;   }
    location /api/v1/function/   { proxy_pass http://minimax-pipeline;   }  # V3.5.18 合并到 pipeline
    location /api/v1/ai/         { proxy_pass http://minimax-ai;         }

    # ===== AI 平台特殊路径 (recognize/embed/route) =====
    location /api/recognize      { proxy_pass http://minimax-ai;         }
    location /api/embed          { proxy_pass http://minimax-ai;         }
    location /api/route          { proxy_pass http://minimax-ai;         }

    # ===== 网关兜底 (其他 /api/* 走 gateway, gateway 自己再路由) =====
    location /api/               { proxy_pass http://minimax-gateway;    }

    # ===== WebSocket 特殊处理 (Upgrade 头) =====
    location /ws/ {
        proxy_pass         http://minimax-ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade        $http_upgrade;
        proxy_set_header   Connection     "upgrade";
        proxy_read_timeout 86400s;  # 24h
    }

    # ===== 健康检查 =====
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","platform":"MiniMax","version":"3.5.19"}';
    }

    # ===== 前端静态资源 (Vue3 dist/) =====
    location / {
        root   /opt/minimax/frontend/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # ===== 监控端点 (Prometheus) =====
    location /actuator/         { proxy_pass http://minimax-monitor;    }

    # ===== 错误页 =====
    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

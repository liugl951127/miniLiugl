# 双录一体化平台 - 4 组织联盟链 Docker Compose
# 用于本地/测试环境
# 4 组织:本行(Bank) / 银保监(Csrc) / 保险(Insurance) / 公证处(Notary)

version: '3.8'

networks:
  fabric:
    name: fabric_dual_record

services:
  # ==================== 4 个 Peer 节点 ====================
  peer0.bank.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_PEER_ID=peer0.bank.com
      - CORE_PEER_ADDRESS=peer0.bank.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bank.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bank.com:7051
      - CORE_PEER_LOCALMSPID=BankMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/bank.com/peers/peer0.bank.com:/etc/hyperledger/fabric/tls
    ports:
      - "7051:7051"
    networks: [fabric]

  peer0.csrc.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_PEER_ID=peer0.csrc.com
      - CORE_PEER_ADDRESS=peer0.csrc.com:8051
      - CORE_PEER_LOCALMSPID=CsrcMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/csrc.com/peers/peer0.csrc.com:/etc/hyperledger/fabric/tls
    ports:
      - "8051:8051"
    networks: [fabric]

  peer0.insurance.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_PEER_ID=peer0.insurance.com
      - CORE_PEER_ADDRESS=peer0.insurance.com:9051
      - CORE_PEER_LOCALMSPID=InsuranceMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/insurance.com/peers/peer0.insurance.com:/etc/hyperledger/fabric/tls
    ports:
      - "9051:9051"
    networks: [fabric]

  peer0.notary.com:
    image: hyperledger/fabric-peer:2.4
    environment:
      - CORE_PEER_ID=peer0.notary.com
      - CORE_PEER_ADDRESS=peer0.notary.com:10051
      - CORE_PEER_LOCALMSPID=NotaryMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
    volumes:
      - ./crypto-config/peerOrganizations/notary.com/peers/peer0.notary.com:/etc/hyperledger/fabric/tls
    ports:
      - "10051:10051"
    networks: [fabric]

  # ==================== Orderer 节点 ====================
  orderer.dual-record.com:
    image: hyperledger/fabric-orderer:2.4
    environment:
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    volumes:
      - ./crypto-config/ordererOrganizations/dual-record.com/orderers/orderer.dual-record.com:/var/hyperledger/orderer/tls
      - ./channel-artifacts:/var/hyperledger/orderer
    ports:
      - "7050:7050"
    networks: [fabric]

  <!-- maskable safe zone: 80% center (10% padding) -->
  <rect width="192" height="192" rx="42" fill="url(#g)" filter="url(#shadow)"/>
  <text x="96" y="116" font-size="84" font-weight="800" fill="white"
        text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif"
        letter-spacing="-2">M</text>
  <circle cx="144" cy="48" r="8" fill="white" opacity="0.85"/>
</svg>

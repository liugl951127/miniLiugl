    <!-- Day 54: 性能优化 - 关键域名预连接 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 关键路由预加载（Dashboard / Chat / Knowledge - 用户最常用） -->
    <link rel="prefetch" href="/dashboard" />
    <link rel="prefetch" href="/chat" />
    <link rel="prefetch" href="/knowledge/list" />
    <link rel="prefetch" href="/agent/canvas" />
    <!-- D3.js for Knowledge Graph Force Layout -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      #initial-loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(at 30% 20%, rgba(99, 102, 241, 0.3) 0px, transparent 50%),
          radial-gradient(at 70% 80%, rgba(236, 72, 153, 0.25) 0px, transparent 50%),
          linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        color: #fff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        z-index: 9999;
      }
      #initial-loader .logo { font-size: 42px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px;
        background: linear-gradient(90deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #initial-loader .sub { color: #cbd5e1; font-size: 14px; margin-bottom: 28px; opacity: 0.9; }
      .dot { width: 10px; height: 10px; border-radius: 50%;
        background: linear-gradient(135deg, #818cf8, #f472b6);
        display: inline-block; margin: 0 5px; animation: bounce 1.4s infinite ease-in-out both;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
      }
      .dot:nth-child(2) { animation-delay: -0.32s; }
      .dot:nth-child(3) { animation-delay: -0.16s; }
      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0.4) translateY(0); opacity: 0.4; }
        40% { transform: scale(1.1) translateY(-4px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="initial-loader">
        <div class="logo">Liugl-AI</div>
        <div class="sub">大模型应用平台 · 加载中</div>
        <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // 注册 Service Worker (PWA 离线支持, 仅生产环境)
      if ('serviceWorker' in navigator) {
        // V3.5.42: dev 跳过, 跟 usePwa.js 一致, 避免 HMR 干扰
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'http:' && location.port === '3000') {
          console.log('[PWA] 开发模式跳过 SW 注册 (避免 HMR 冲突)');
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js?v=__SW_BUILD_TIME__', { scope: '/' }).then(reg => {
              console.log('SW registered:', reg.scope);
            }).catch(err => {
              console.warn('SW register failed:', err);
            });
          });
        }
      }
    </script>
  </body>
</html>

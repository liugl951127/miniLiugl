      ```js
      import http from './http'

      const PREFIX = '/agent-group'
      const USER_ID = () => localStorage.getItem('userId') || '1'

      export const agentGroupApi = {
        listGroups: () => http.get(`${PREFIX}/list`).catch(() => [{ id: 1, name: '默认群' }]),
        listMembers: (groupId) => http.get(`${PREFIX}/${groupId}/members`),
        addMember: (groupId, data) => http.post(`${PREFIX}/${groupId}/members`, data),
        updateMember: (groupId, memberId, data) => http.put(`${PREFIX}/${groupId}/members/${memberId}`, data),
        removeMember: (groupId, memberId) => http.delete(`${PREFIX}/${groupId}/members/${memberId}`),
        reorder: (groupId, order) => http.put(`${PREFIX}/${groupId}/members/reorder`, order),
        getStrategies: () => http.get(`${PREFIX}/strategies`),
        // SSE 流式
        runStream: (groupId, body) => {
          const url = `/api/v1/agent-group/${groupId}/run`
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-User-Id': USER_ID() },
            body: JSON.stringify(body)
          })
        }
      }
      ```


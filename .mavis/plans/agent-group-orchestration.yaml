      ## 5. SSE 处理
      ```js
      async function run() {
        const res = await agentGroupApi.runStream(groupId, { goal, strategy, tools: [] })
        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buf = ''
        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          buf += decoder.decode(value, { stream: true })
          // 解析 SSE: "event: step-token\ndata: {...}\n\n"
          const lines = buf.split('\n\n')
          buf = lines.pop()
          for (const chunk of lines) {
            const [ev, dt] = chunk.split('\n').reduce((acc, l) => {
              if (l.startsWith('event:')) acc[0] = l.slice(7).trim()
              if (l.startsWith('data:')) acc[1] = (acc[1] || '') + l.slice(6)
              return acc
            }, ['', ''])
            if (!ev) continue
            const data = JSON.parse(dt)
            if (ev === 'step-start') steps.value.push({ ...data, content: '' })
            else if (ev === 'step-token') {
              const s = steps.value.find(x => x.agentCode === data.agentCode)
              if (s) s.content += data.content
            }
            else if (ev === 'step-end') { /* 标记完成 */ }
            else if (ev === 'final') { /* 显示最终结果 */ }
          }
        }
      }
      ```


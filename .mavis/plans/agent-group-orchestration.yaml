      在 /workspace/miniLiugl/backend/ 新增多智能体群编排能力:

      ## 1. 数据库 (minimax-common/src/main/resources/sql/minimax-schema.sql)
      加表 `agent_group_member`:
      ```sql
      CREATE TABLE IF NOT EXISTS agent_group_member (
          id BIGINT PRIMARY KEY AUTO_INCREMENT,
          group_id BIGINT NOT NULL,
          agent_code VARCHAR(64) NOT NULL,
          role VARCHAR(32) NOT NULL DEFAULT 'WORKER', -- MANAGER | WORKER | CRITIC
          position INT NOT NULL DEFAULT 0,
          config_json VARCHAR(2000) DEFAULT '',
          enabled TINYINT NOT NULL DEFAULT 1,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          INDEX idx_group (group_id, position)
      );
      ```
      加 3 条 seed (针对已有的 AgentGroup.id=1) 到 minimax-seed.sql

      ## 2. 实体 + Mapper (新建 minimax-ai/marketplace 包)
      - `entity/AgentGroupMember.java` — 字段如上, MyBatis-Plus @TableName
      - `mapper/AgentGroupMemberMapper.java` — BaseMapper<AgentGroupMember>
      - 已有 `AgentGroup.java` 不用改

      ## 3. Service + Orchestrator (新建)
      - `service/AgentGroupMemberService.java` — 简单 CRUD (listByGroupId, addMember, updateMember, removeMember, reorder)
      - `service/AgentGroupOrchestrator.java` — 核心编排器:
        ```java
        public class AgentGroupOrchestrator {
            public SseEmitter run(Long userId, Long groupId, String goal, List<String> toolCodes);
            // 1. 加载 group 全部 member (按 position 排序)
            // 2. 按 strategy 编排:
            //    - PIPELINE: 顺序执行, 上一步输出作为下一步输入
            //    - PARALLEL: 并行执行 (CompletableFuture), 合并结果
            //    - DEBATE: MANAGER 提问 → N WORKER 各自回答 → CRITIC 评分 → 选最高
            // 3. 通过 SseEmitter 推流:
            //    event: "step-start" {agentCode, role, position}
            //    event: "step-token" {agentCode, content}
            //    event: "step-end" {agentCode, output}
            //    event: "final" {success, finalAnswer, totalSteps, durationMs}
            // 4. 复用 LlmGatewayService 调 LLM (或 PromptTemplateService)
        }
        ```

      ## 4. Controller (新建)
      - `controller/AgentGroupOrchestrationController.java`:
        - `GET    /api/v1/agent-group/{groupId}/members` — 列表
        - `POST   /api/v1/agent-group/{groupId}/members` (body: {agentCode, role, position, configJson}) — 添加成员
        - `PUT    /api/v1/agent-group/{groupId}/members/{memberId}` — 更新
        - `DELETE /api/v1/agent-group/{groupId}/members/{memberId}` — 删除
        - `PUT    /api/v1/agent-group/{groupId}/members/reorder` (body: [{memberId, position}, ...]) — 调整顺序
        - `POST   /api/v1/agent-group/{groupId}/run` (body: {goal, tools, strategy}) → SseEmitter — 流式执行
          strategy 字段: PIPELINE | PARALLEL | DEBATE (默认 PIPELINE)
        - `GET    /api/v1/agent-group/strategies` — 返回可用策略列表

      ## 5. Strategy pattern
      - `service/orchestrator/GroupStrategy.java` 接口:
        ```java
        public interface GroupStrategy {
            String name(); // PIPELINE | PARALLEL | DEBATE
            void execute(Long userId, List<AgentGroupMember> members, String goal, SseEmitter emitter) throws IOException;
        }
        ```
      - 3 个实现: `PipelineStrategy`, `ParallelStrategy`, `DebateStrategy`
      - 复用现有 LlmGatewayService (在 minimax-model 或 minimax-ai)

      ## 6. Gateway route (minimax-gateway/src/main/resources/application.yml)
      加路由:
      ```yaml
      - id: agent-group-orchestration
        uri: lb://minimax-ai
        predicates: [Path=/api/v1/agent-group/**]
        filters: [StripPrefix=0]
      ```
      (假设已有 /api/v1/agent-group 路由则合并; 优先级高于通用 ai 路由)


      ## 3. 加 API 调用 (src/api/kg.js 已存在, 扩)
      - `buildKg(kbId)` POST /api/v1/rag/kb/{kbId}/kg/build
      - `getKg(kbId)` GET /api/v1/rag/kb/{kbId}/kg
      - `getKgStats(kbId)` GET /api/v1/rag/kb/{kbId}/kg/stats
      - `searchKg(kbId, kw)` GET /api/v1/rag/kb/{kbId}/kg/search?kw=
      - `reasonKg(src, tgt)` GET /api/v1/rag/kg/reason?src=&tgt=
      - `clearKg(kbId)` DELETE /api/v1/rag/kb/{kbId}/kg

      ## 4. 加 data + functions (script setup 末尾):
      ```js
      const kgKbId = ref(null)
      const kgEntities = ref([])
      const kgRelations = ref([])
      const kgLoading = ref(false)
      const kgBuilding = ref(false)
      const kgStats = ref({ entities: 0, relations: 0 })
      const kgSearchKw = ref('')
      const reasonerVisible = ref(false)
      const reasonerSrc = ref('')
      const reasonerTgt = ref('')
      const reasonerPaths = ref([])
      const reasonerRan = ref(false)

      async function buildKg() {
        if (!kgKbId.value) { ElMessage.warning('先选知识库'); return }
        kgBuilding.value = true
        try {
          const r = await kgApi.buildKg(kgKbId.value)
          ElMessage.success(`抽取完成: ${r?.data?.entities || 0} 实体 / ${r?.data?.relations || 0} 关系`)
          loadKg()
        } catch (e) { ElMessage.error('构建失败: ' + (e?.response?.data?.message || e?.message)) }
        finally { kgBuilding.value = false }
      }
      async function loadKg() {
        if (!kgKbId.value) return
        kgLoading.value = true
        try {
          const r = await kgApi.getKg(kgKbId.value)
          const d = r?.data || r || {}
          kgEntities.value = d.entities || []
          kgRelations.value = d.relations || []
          kgStats.value = { entities: kgEntities.value.length, relations: kgRelations.value.length }
        } catch (e) { /* 后端未就绪时静默 */ kgEntities.value = []; kgRelations.value = []; kgStats.value = { entities: 0, relations: 0 } }
        finally { kgLoading.value = false }
      }
      async function searchEntity() {
        if (!kgKbId.value || !kgSearchKw.value.trim()) return
        const r = await kgApi.searchKg(kgKbId.value, kgSearchKw.value.trim())
        const list = r?.data || r || []
        // 高亮 (简单替换 entities 列表)
        const lc = kgSearchKw.value.toLowerCase()
        kgEntities.value = kgEntities.value.map(e => ({ ...e, _hit: e.name?.toLowerCase().includes(lc) }))
        ElMessage.success(`找到 ${list.length} 个匹配`)
      }
      function onEntityClick(e) {
        reasonerSrc.value = e.name
      }
      function openReasoner() { reasonerVisible.value = true; reasonerPaths.value = []; reasonerRan.value = false }
      async function runReasoner() {
        if (!reasonerSrc.value || !reasonerTgt.value) { ElMessage.warning('填两个实体'); return }
        try {
          const r = await kgApi.reasonKg(reasonerSrc.value, reasonerTgt.value)
          const d = r?.data || r || {}
          reasonerPaths.value = d.paths || []
          reasonerRan.value = true
          if (!reasonerPaths.value.length) ElMessage.info('未找到路径')
        } catch (e) { ElMessage.error('推理失败: ' + (e?.response?.data?.message || e?.message)) }
      }
      ```


version: 1
plan:
  name: "知识图谱: 替换 placeholder + 真实可视化 + KB 实体抽取"
  max_concurrency: 2
  max_consecutive_failures: 3
  max_cycles: 5
  auto_accept: false
  auto_reject_retries: 0

tasks:
  # ============ T1: 后端 KB → 知识图谱 实体抽取 + 图谱 API ============
  - id: T1-backend-kg-extract
    title: "后端: KB 实体抽取 + 图谱查询 + 关系推理"
    assigned_to: general
    role: produce
    verified_by: explore
    depends_on: []
    timeout_ms: 1500000
    max_retries: 1
    prompt: |
      在 /workspace/miniLiugl/backend/ 加 KB → 知识图谱 抽取能力。
      现有的 `kg_entity` / `kg_relation` / `AgentKgController` (在 minimax-agent) 已有 8 个种子实体 + 9 条关系。
      现需:

      ## 1. 新表 `kb_extracted_entity` (minimax-common/src/main/resources/sql/minimax-schema.sql)
      ```sql
      CREATE TABLE IF NOT EXISTS kb_extracted_entity (
          id BIGINT PRIMARY KEY AUTO_INCREMENT,
          kb_id BIGINT NOT NULL,
          name VARCHAR(128) NOT NULL,
          type VARCHAR(32) NOT NULL DEFAULT 'CONCEPT',  -- PERSON/ORG/CONCEPT/PRODUCT/PLACE
          freq INT NOT NULL DEFAULT 1,
          source_doc_id BIGINT,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          INDEX idx_kb (kb_id, freq)
      );
      CREATE TABLE IF NOT EXISTS kb_extracted_relation (
          id BIGINT PRIMARY KEY AUTO_INCREMENT,
          kb_id BIGINT NOT NULL,
          src_entity VARCHAR(128) NOT NULL,
          rel VARCHAR(32) NOT NULL,        -- CO_OCCUR / RELATED / MENTION
          tgt_entity VARCHAR(128) NOT NULL,
          weight INT NOT NULL DEFAULT 1,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          INDEX idx_kb_rel (kb_id, src_entity, tgt_entity)
      );
      ```

      ## 2. EntityExtractor 服务 (新建 minimax-rag 模块)
      - `backend/minimax-rag/src/main/java/com/minimax/rag/kg/EntityExtractor.java`
      - 用 SmartChineseAnalyzer (lucene-analyzers-smartcn 8.11.0, 项目已有依赖) 对 kb_document 文档分词
      - 启发式抽取实体:
        1. 名词短语 (长度 2-6 字符, 词性为名词)
        2. 高频词 (TF > 阈值, 比如 ≥3)
        3. 跨文档共现: 同一段/同一句出现 2 个实体, 加 CO_OCCUR 边
      - 输入: kb_id
      - 输出: List<Entity> + List<Relation>
      - 调 `kb_document` 已有 mapper, 拉该 KB 全部文档的 `content` 字段
      - 用 IK/SmartChinese 分词 → 算 TF → 阈值过滤 → 写库
      - 关联到已有 `kg_entity` (按 name 合并, 跨 KB 全局共享)

      ## 3. Controller (新建)
      - `backend/minimax-rag/src/main/java/com/minimax/rag/controller/KbKgController.java`:
        - `POST /api/v1/rag/kb/{kbId}/kg/build` → 触发抽取, 返回 {entities: N, relations: M}
        - `GET  /api/v1/rag/kb/{kbId}/kg` → 拉该 KB 的图 (entities + relations)
        - `GET  /api/v1/rag/kb/{kbId}/kg/stats` → 统计
        - `GET  /api/v1/rag/kb/{kbId}/kg/search?kw=xxx` → 模糊搜索实体
        - `GET  /api/v1/rag/kg/reason?src=X&tgt=Y` → 关系推理 (BFS 找两实体间路径, 复用 AgentKgController.findPath 逻辑)
        - `DELETE /api/v1/rag/kb/{kbId}/kg` → 清空该 KB 抽取结果

      ## 4. 复用 AgentKgController.findPath
      或新写 `RelationReasoner.java` (在 minimax-rag):
      - BFS 2-hop: src → 中间 → tgt
      - 3-hop: src → m1 → m2 → tgt
      - 返回所有路径 + 评分

      ## 5. Gateway (minimax-gateway)
      路由已有 /api/v1/rag/**, 不用改

      ## 6. seed (minimax-seed.sql)
      给 1 号 KB 加 10 个 extracted_entity + 15 条 extracted_relation 演示数据

      ## 最后编译:
      ```bash
      cd /workspace/miniLiugl/backend
      export JAVA_HOME=/opt/jdk-17.0.2
      export PATH=$JAVA_HOME/bin:/opt/apache-maven-3.9.6/bin:$PATH
      mvn package -DskipTests -s ~/.m2/settings.xml 2>&1 | tail -30
      ```
      必须 BUILD SUCCESS

    verify_prompt: |
      验证:
      1. kb_extracted_entity / kb_extracted_relation 表在 schema.sql
      2. EntityExtractor.java 完整, 调 SmartChineseAnalyzer
      3. KbKgController 有 6 个端点
      4. seed.sql 加了演示数据
      5. mvn package BUILD SUCCESS

  # ============ T2: 前端 - 替换 placeholder, 真实图谱可视化 + 推理 ============
  - id: T2-frontend-kg-viz
    title: "前端: 替换 placeholder, D3 图谱 + 关系推理 UI"
    assigned_to: general
    role: produce
    verified_by: explore
    depends_on: []
    timeout_ms: 1500000
    max_retries: 1
    prompt: |
      在 /workspace/miniLiugl/frontend/ 把 knowledge/Index.vue 的"知识图谱"tab 替换成真实图谱。

      ## 1. 复用 / 重构
      - 现有 /workspace/miniLiugl/frontend/src/views/kg/Index.vue 是 1464 行完整 D3 图谱实现
      - 抽核心 D3 逻辑到 /workspace/miniLiugl/frontend/src/components/KgGraph.vue (reusable)
        - props: entities (Array), relations (Array), selectedKb (Number)
        - events: @entity-click, @relation-click
        - 用 d3-force / d3-zoom / d3-drag, 画 svg
        - 节点: 圆 + label, 类型不同颜色
        - 边: 直线 + rel 标签
      - kg/Index.vue 改造: 复用 KgGraph 组件

      ## 2. 修改 /workspace/miniLiugl/frontend/src/views/knowledge/Index.vue
      把第 72-89 行 (el-tab-pane name="kg" 整个 el-empty placeholder) 替换为:
      ```vue
      <el-tab-pane name="kg">
        <template #label><span>🕸️ 知识图谱</span></template>
        <div class="kg-tab">
          <!-- 顶部工具条 -->
          <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
            <el-select v-model="kgKbId" placeholder="选择知识库" size="small" style="width:200px" @change="loadKg">
              <el-option v-for="kb in kbs" :key="kb.id" :label="kb.name" :value="kb.id" />
            </el-select>

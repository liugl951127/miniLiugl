version: 1
plan:
  name: "前端企业级升级 - 4 并行领域"
  goal: |
    把前端所有 41 个 view 文件升级到企业级：
    (1) 修真实"未集成"功能 (placeholder tab / 0-API / TODO)
    (2) 加 loading / empty / error 状态
    (3) 加表单验证 / 确认对话框 / 操作反馈
    (4) 消除 console.log / TODO / 假按钮

variables:
  workspace: /workspace/miniLiugl
  frontend: /workspace/miniLiugl/frontend
  api_dir: /workspace/miniLiugl/frontend/src/api
  views_dir: /workspace/miniLiugl/frontend/src/views

# 企业级标准
common_standards: |
  ★ 企业级标准（每个 task 必须达到）:
  1. **真实 API 集成**: 所有数据来自后端 API, 删除硬编码 mock / Math.random / 假数据
  2. **Loading 状态**: 列表/卡片用 `v-loading="loading"`, 首次加载有 skeleton
  3. **空状态**: 数据为空时显示 `<el-empty description="...">` + 引导按钮
  4. **错误处理**: 所有 API 调用 `try/catch`, 失败用 `ElMessage.error()` 提示
  5. **确认对话框**: 删除等破坏性操作必须用 `ElMessageBox.confirm()` 二次确认
  6. **操作反馈**: 成功用 `ElMessage.success()`, 警告用 `ElMessage.warning()`
  7. **表单验证**: 必填字段用 `:rules` 校验, 错误信息明确
  8. **占位符消除**: 不允许 `tab-placeholder` `canvas-placeholder` `chart-placeholder` `scan-placeholder` `explain-placeholder` 这些"假按钮"占位（要么实现要么改为外部跳转引导）
  9. **零 console.log**: 调试用的 console.log 要么删除要么用 console.debug
  10. **零 TODO**: 不留 TODO 注释（除非功能确实依赖后端尚未提供的 API）

  ★ 验证方式:
  - `cd /workspace/miniLiugl/frontend && npm run build` 必须成功
  - ESLint 无 error
  - 修改文件不超过原文件 +50% 行数（避免过度膨胀）


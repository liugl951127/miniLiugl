      2. monitor/Index.vue: 告警/规则/通道 v-loading + empty + 反馈 + :rules
      3. notification/Index.vue: 通知列表 v-loading + empty + 标记已读/删除反馈
      4. rule/Index.vue: 规则 CRUD + explain-placeholder 改为友好空状态
      5. analytics/Index.vue: 所有 Tab 都有 v-loading + empty + 反馈
      6. 通用: 占位符消除 / console.log 清理 / :rules
      最后: cd /workspace/miniLiugl/frontend && NODE_OPTIONS='--max-old-space-size=1500' npx vite build 验证成功

  - id: T4C-misc
    title: "apikey + tenant + plugins + chat/Stream + agent 子组件 企业级升级"
    assigned_to: general
    verified_by: explore
    timeout_ms: 1200000

name: verify-sql-real

on:
  push:
    paths:
      - 'sql/**'
      - 'scripts/gen_sql_from_entities.py'
  pull_request:
    paths:
      - 'sql/**'
      - 'scripts/gen_sql_from_entities.py'
  workflow_dispatch:

jobs:
  real-verify:
    name: MariaDB 10.6 严格模式真跑 SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: minimax_mariadb_2024
          MARIADB_DATABASE: minimax_platform
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
          --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 mariadb-client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: 等待 MariaDB 就绪
        run: |
          for i in {1..30}; do
            if mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "SELECT 1" >/dev/null 2>&1; then
              echo "✓ MariaDB ready (等待 $i 次)"
              exit 0
            fi
            echo "等待... ($i/30)"
            sleep 2
          done
          echo "✗ MariaDB 启动超时"
          exit 1

      - name: 设置 sql_mode 严格
        run: |
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "
            SET GLOBAL sql_mode = 'STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';
            SHOW VARIABLES LIKE 'sql_mode';
          "

      - name: 删除旧库 (干净环境)
        run: |
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "
            DROP DATABASE IF EXISTS minimax_platform;
            CREATE DATABASE minimax_platform DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            USE minimax_platform;
            SHOW VARIABLES LIKE 'sql_mode';
          "

      - name: 跑 SQL 部署 (收集错误)
        id: deploy
        run: |
          # 用 --force 忽略错误, 全部跑完, 然后检查表
          set +e
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform \
            --force < sql/minimax-mysql-final.sql 2>&1 | tee /tmp/sql-deploy.log
          DEPLOY_EXIT=$?
          set -e
          echo "deploy_exit=$DEPLOY_EXIT"
          echo "deploy_exit<<EOF" >> $GITHUB_OUTPUT
          echo "$DEPLOY_EXIT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 收集错误行
        if: always()
        run: |
          echo "═══ 部署错误汇总 ═══"
          grep -E "ERROR|Error" /tmp/sql-deploy.log | head -50 || echo "  无 ERROR"
          echo ""
          echo "═══ 警告行 ═══"
          grep -E "WARN|Warning" /tmp/sql-deploy.log | head -20 || echo "  无 WARN"

      - name: 验证表数 (>= 90)
        run: |
          TABLES=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.tables 
            WHERE table_schema='minimax_platform' AND table_type='BASE TABLE';
          ")
          echo "Tables: $TABLES"
          if [ "$TABLES" -lt 90 ]; then
            echo "✗ 期望 >= 90, 实际 $TABLES"
            exit 1
          fi
          echo "✓ 表数足够"

      - name: 验证关键表 schema (1/N)
        run: |
          # 测 analytics_datasource (上次出错)
          echo "═══ analytics_datasource (上次 1067 错) ═══"
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SHOW CREATE TABLE analytics_datasource\G
          "

      - name: 验证关键表 schema (2/N)
        run: |
          # 测 document_chunk (BLOB)
          echo "═══ document_chunk (BLOB embedding) ═══"
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SHOW CREATE TABLE document_chunk\G
          "

      - name: 验证关键表 schema (3/N)
        run: |
          # 测 alert_channel (template 列)
          echo "═══ alert_channel (template) ═══"
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SHOW CREATE TABLE alert_channel\G
          "

      - name: 验证种子数据 (5 测试账号)
        run: |
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SELECT id, username, nickname, status, deleted FROM sys_user 
            WHERE username IN ('admin','demo','test','guest','vip') 
            ORDER BY id;
          "
          COUNT=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B minimax_platform -e "
            SELECT COUNT(*) FROM sys_user WHERE username IN ('admin','demo','test','guest','vip');
          ")
          if [ "$COUNT" -ne 5 ]; then
            echo "✗ 期望 5 个测试账号, 实际 $COUNT"
            exit 1
          fi
          echo "✓ 5 测试账号"

      - name: 验证 schema_version
        run: |
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SELECT version, description, applied_at FROM schema_version ORDER BY id;
          "

      - name: 验证触发器
        run: |
          TRIGGERS=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='minimax_platform';
          ")
          echo "Triggers: $TRIGGERS"
          if [ "$TRIGGERS" -lt 2 ]; then
            echo "✗ 期望 >= 2, 实际 $TRIGGERS"
            exit 1
          fi
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SELECT TRIGGER_NAME, EVENT_MANIPULATION, ACTION_TIMING 
            FROM information_schema.triggers 
            WHERE trigger_schema='minimax_platform';
          "

      - name: 验证存储过程和函数
        run: |
          PROCS=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.routines 
            WHERE routine_schema='minimax_platform' AND routine_type='PROCEDURE';
          ")
          FUNCS=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.routines 
            WHERE routine_schema='minimax_platform' AND routine_type='FUNCTION';
          ")
          echo "PROCEDURE: $PROCS, FUNCTION: $FUNCS"
          if [ "$PROCS" -lt 1 ] || [ "$FUNCS" -lt 2 ]; then
            echo "✗ 期望 PROCEDURE>=1, FUNCTION>=2"
            exit 1
          fi
          echo "✓ 存储过程和函数"
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SELECT ROUTINE_NAME, ROUTINE_TYPE FROM information_schema.routines 
            WHERE routine_schema='minimax_platform';
          "

      - name: 测试函数 fn_mask_phone
        run: |
          RESULT=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B minimax_platform -e "
            SELECT fn_mask_phone('13800001234');
          ")
          echo "fn_mask_phone('13800001234') = $RESULT"
          if [ "$RESULT" != "138****1234" ]; then
            echo "✗ 期望 138****1234, 实际 $RESULT"
            exit 1
          fi

      - name: 测试函数 fn_user_activity_score
        run: |
          RESULT=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B minimax_platform -e "
            SELECT fn_user_activity_score(1);
          ")
          echo "fn_user_activity_score(1) = $RESULT"

      - name: 测试 INSERT IGNORE 重复不报错
        run: |
          # 跑第二次, 验证 INSERT IGNORE 不报错
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform < sql/minimax-mysql-final.sql
          echo "✓ 第二次跑成功 (INSERT IGNORE 保护)"

      - name: 验证 INSERT 实际值 (5 账号密码 hash)
        run: |
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 minimax_platform -e "
            SELECT username, LEFT(password, 30) AS password_prefix, LENGTH(password) AS hash_len
            FROM sys_user WHERE username IN ('admin','demo','test','guest','vip');
          "

      - name: 验证索引数
        run: |
          INDEXES=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.statistics 
            WHERE table_schema='minimax_platform' AND index_name != 'PRIMARY';
          ")
          echo "Indexes (非主键): $INDEXES"
          if [ "$INDEXES" -lt 80 ]; then
            echo "✗ 期望 >= 80, 实际 $INDEXES"
            exit 1
          fi
          echo "✓ 索引数足够"

      - name: 验证字符集
        run: |
          # 所有表都应 utf8mb4
          BAD=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.tables 
            WHERE table_schema='minimax_platform' 
            AND table_type='BASE TABLE'
            AND (table_collation NOT LIKE 'utf8mb4%' OR table_collation IS NULL);
          ")
          if [ "$BAD" -gt 0 ]; then
            echo "✗ $BAD 个表非 utf8mb4"
            mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "
              SELECT table_name, table_collation FROM information_schema.tables 
              WHERE table_schema='minimax_platform' 
              AND table_type='BASE TABLE'
              AND (table_collation NOT LIKE 'utf8mb4%' OR table_collation IS NULL);
            "
            exit 1
          fi
          echo "✓ 全部 utf8mb4"

      - name: 验证 NOT NULL + DEFAULT 完整性
        run: |
          # 找所有 NOT NULL 但无 DEFAULT 字段
          mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "
            SELECT 
              table_name, column_name, column_type, is_nullable, column_default
            FROM information_schema.columns
            WHERE table_schema = 'minimax_platform'
              AND is_nullable = 'NO'
              AND column_default IS NULL
              AND extra NOT LIKE '%auto_increment%'
              AND column_key NOT LIKE '%PRI%'
            ORDER BY table_name, column_name;
          " | head -30
          echo ""
          COUNT=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema = 'minimax_platform'
              AND is_nullable = 'NO'
              AND column_default IS NULL
              AND extra NOT LIKE '%auto_increment%'
              AND column_key NOT LIKE '%PRI%';
          ")
          if [ "$COUNT" -gt 0 ]; then
            echo "✗ 仍有 $COUNT 个 NOT NULL 无 DEFAULT 字段"
            exit 1
          fi
          echo "✓ 所有 NOT NULL 都有 DEFAULT"

      - name: 验证 DATETIME/DATE/TIME 不允许 DEFAULT 0
        run: |
          BAD=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema = 'minimax_platform'
              AND data_type IN ('datetime', 'timestamp', 'date', 'time', 'year')
              AND column_default = '0000-00-00 00:00:00';
          ")
          if [ "$BAD" -gt 0 ]; then
            echo "✗ 仍有 $BAD 个 DATETIME DEFAULT 0"
            mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -e "
              SELECT table_name, column_name, data_type, column_default
              FROM information_schema.columns
              WHERE table_schema = 'minimax_platform'
                AND data_type IN ('datetime', 'timestamp', 'date', 'time', 'year')
                AND column_default = '0000-00-00 00:00:00';
            "
            exit 1
          fi
          echo "✓ 无 DATETIME DEFAULT 0"

      - name: 验证 BLOB/TEXT/JSON 无 DEFAULT
        run: |
          BAD=$(mariadb -h127.0.0.1 -uroot -pminimax_mariadb_2024 -N -B -e "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema = 'minimax_platform'
              AND data_type IN ('blob', 'text', 'json')
              AND column_default IS NOT NULL
              AND column_default != 'NULL';
          ")
          if [ "$BAD" -gt 0 ]; then
            echo "✗ 仍有 $BAD 个 BLOB/TEXT/JSON 有 DEFAULT"
            exit 1
          fi
          echo "✓ BLOB/TEXT/JSON 都无 DEFAULT"

      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-deploy-log
          path: /tmp/sql-deploy.log
          retention-days: 7

      - name: 总结
        if: success()
        run: |
          echo "════════════════════════════════════════"
          echo "✓ MariaDB 严格模式真跑 SQL 全部通过"
          echo "  - 90+ 表创建"
          echo "  - 5 测试账号种子"
          echo "  - 2+ 触发器"
          echo "  - 1+ 存储过程 + 2+ 函数"
          echo "  - 80+ 索引"
          echo "  - 0 个 NOT NULL 无 DEFAULT"
          echo "  - 0 个 DATETIME DEFAULT 0"
          echo "  - 0 个 BLOB/TEXT/JSON DEFAULT"
          echo "════════════════════════════════════════"

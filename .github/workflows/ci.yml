name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
  JAVA_VERSION: "17"
  NODE_VERSION: "18"

jobs:
  # ============================================
  # 后端编译 + 测试
  # ============================================
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root123456
          MARIADB_DATABASE: minimax
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile backend
        working-directory: backend
        run: |
          mvn -s .mvn/settings.xml compile -B -T 4
        continue-on-error: false

      - name: Run unit tests
        working-directory: backend
        run: |
          mvn -s .mvn/settings.xml test -B \
            -pl minimax-ai,minimax-common,minimax-multimodal,minimax-monitor \
            -Dmaven.test.skip=false
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/site/

  # ============================================
  # 前端编译
  # ============================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================
  # 前端 Vitest 单元测试 (Day 26)
  # ============================================
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:unit:coverage
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7

  # ============================================
  # 前端 Playwright E2E 测试 (Day 26)
  # ============================================
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Day 27: 优化 - 用 preview 而非 serve，后台启动 + 等待就绪
      - name: Start preview server & run E2E
        working-directory: frontend
        run: |
          # 后台启动 vite preview (package.json: port 4173)
          npm run preview -- --port 4173 --host &
          PREVIEW_PID=$!
          # 等端口就绪 (最多 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null 2>&1; then
              echo "Preview server ready after ${i}s"
              break
            fi
            sleep 1
          done
          # 运行测试
          npx playwright test --reporter=line,junit || true
          # 清理
          kill $PREVIEW_PID 2>/dev/null || true
        env:
          E2E_BASE_URL: 'http://localhost:4173'

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e-report/
          retention-days: 7

  # ============================================
  # Docker 镜像构建 (main 分支)
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        module:
          - minimax-gateway
          - minimax-auth
          - minimax-chat
          - minimax-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build JAR
        working-directory: backend
        run: |
          mvn -s .mvn/settings.xml package \
            -pl ${{ matrix.module }} -am -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.module
          build-args: |
            MODULE=${{ matrix.module }}
          push: false
          tags: minimax/${{ matrix.module }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 集成测试 (可选)
  # ============================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run integration tests
        working-directory: backend
        run: |
          mvn -s .mvn/settings.xml verify -B -DskipITs=false
        continue-on-error: true


  # ============================================
  # V3.5.95+: CI 9 项硬性检查 (V3.5.65 4 项 + V3.5.87 menu + V3.5.95 <script setup> + V3.5.95 docker-compose)
  # ============================================
  ci-check:
    name: CI 9 项硬性检查 (V3.5.95+)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Check 1-9: bash + python (V3.5.65-V3.5.95)
      - name: Run ci-check.sh (Check 1-9)
        run: bash scripts/ci-check.sh

      # Check 8 详细报告: <script setup> 防御性自检
      - name: Check 8 - <script setup> 防御性自检
        run: node scripts/check-setup-var.cjs

      # Check 9 详细报告: docker-compose 静态验证
      - name: Check 9 - docker-compose 静态验证
        run: bash scripts/verify-docker-compose.sh

      # Check 10: entity ↔ schema 自动对比 (V3.5.38+)
      - name: Run check_entity_schema.py
        run: python3 scripts/check_entity_schema.py
        continue-on-error: true

  # ============================================
  # V3.5.82+: 跨浏览器部署验证 (5 browser matrix)
  # V3.5.78 之前: 单 job 内 5 browser 串行跑 (3 step)
  # V3.5.82 之后: 5 browser matrix 并行跑 (5 独立 job)
  # ============================================
  verify-deploy:
    name: V3.5.82 跨浏览器 ${{ matrix.browser }} E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox, mobile-safari, mobile-chrome]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          mvn -s .mvn/settings.xml dependency:go-offline -B -q
        continue-on-error: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Install Playwright browser (${{ matrix.browser }})
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run verify-deploy.sh (${{ matrix.browser }})
        env:
          SKIP_BACKEND: '1'
        run: bash scripts/verify-deploy.sh ${{ matrix.browser }}

      - name: Upload verify-deploy report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-deploy-${{ matrix.browser }}
          path: |
            reports/verify-deploy/
            frontend/e2e-report/
          retention-days: 14

  # ============================================
  # V3.5.82+: verify-deploy 汇总 (depends_on 5 matrix jobs)
  # ============================================
  verify-deploy-summary:
    name: V3.5.82 跨浏览器 5 browser 汇总
    runs-on: ubuntu-latest
    needs: [verify-deploy]
    if: always()
    steps:
      - name: Matrix 汇总
        run: |
          echo "## 跨浏览器 E2E 汇总" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for browser in chromium webkit firefox mobile-safari mobile-chrome; do
            status="${{ needs.verify-deploy.result }}"
            echo "| $browser | $status |" >> $GITHUB_STEP_SUMMARY
          done
          if [ "${{ needs.verify-deploy.result }}" != "success" ]; then
            echo "❌ 至少一个浏览器失败" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ 5 浏览器全部通过" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 总结
  # ============================================
  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-unit, frontend-e2e, ci-check, verify-deploy-summary]  # V3.5.95+ ci-check 含 Check 8/9
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.backend.result }}" == "success" ] && \
             [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ All checks passed"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi

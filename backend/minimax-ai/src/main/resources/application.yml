# =============================================================
# MiniMax AI 自研服务配置 (V2.5)
# 端口: 8094
# =============================================================

server:
  port: ${SERVER_PORT:8094}

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: minimax-ai
  profiles:
    active: mysql   # V3.5.5+ 默认 MySQL/MariaDB 生产连接 (H2 → 沙箱 / dev → 内存开发)
  main:
    allow-bean-definition-overriding: true

# 自研 AI 配置
minimax:
  ai:
    # 模型类型
    type: transformer-small  # 简化版 transformer
    # 词表大小
    vocab-size: 8192
    # 隐藏层维度
    hidden-dim: 128
    # 注意力头数
    num-heads: 4
    # 层数
    num-layers: 2
    # 最大序列长度
    max-seq-len: 128
    # 推理温度
    temperature: 0.8
    # top-k 采样
    top-k: 40
    # top-p 采样
    top-p: 0.9
    # 模型文件路径
    model-path: ${MODEL_PATH:./data/ai/model.bin}
    # 是否启动时自动训练
    auto-train: ${AUTO_TRAIN:true}
    # 训练数据
    training-data-path: ${TRAINING_DATA:./data/ai/training-data.txt}

    # ── V6.8.2: 训练模型推理路由 ──────────────────────────────────
    # 训练模型（law-gpt-v1 / med-gpt-v2 等）实际调用的真实 LLM
    # 可选: deepseek-chat / gpt-4o-mini / gpt-4o（需配置对应 API Key）
    training:
      target-model: ${AI_TRAINING_TARGET_MODEL:deepseek-chat}

    # ── Day 29: 智能模型路由配置 ──────────────────────────────────
    # Provider 开关: auto / self / external
    #   auto       — 两类模型都参与路由，按策略选最优 (默认)
    #   self       — 仅自研模型，不依赖外部 API key
    #   external   — 仅外部模型，需配置下面 key
    provider-mode: ${MODEL_PROVIDER_MODE:auto}

    # 外部模型 API Key (不配置则外部模型不参与路由)
    openai-api-key: ${OPENAI_API_KEY:}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}

    # 自研模型质量开关 (true=全部开启, false=仅基础对话)
    self-model-full: ${SELF_MODEL_FULL:true}

    # ── V7.0: ONNX 自研模型推理 ─────────────────────────────────
    onnx:
      enabled: ${ONNX_ENABLED:false}              # 设为 true 启用 ONNX 推理
      model-dir: ${ONNX_MODEL_DIR:/workspace/onnx-models}  # ONNX 模型文件目录
      model-name: ${ONNX_MODEL_NAME:mini-transformer}      # 模型文件名（不含 .onnx 后缀）
      vocab-size: ${ONNX_VOCAB_SIZE:8192}          # 必须与导出模型一致
      hidden-dim: ${ONNX_HIDDEN_DIM:256}           # 必须与导出模型一致
      heads: ${ONNX_HEADS:8}                        # 注意力头数
      layers: ${ONNX_LAYERS:4}                      # Transformer 层数
      max-seq-len: ${ONNX_MAX_SEQ_LEN:512}         # 最大序列长度

    # ── V7.1: ONNX 多模态 (本地图片/视频/语音智能) ─────────
    # 模型路径默认指向 git lfs 跟踪的 ./data/models/
    onnx-vision:
      enabled: ${ONNX_VISION_ENABLED:true}
      resnet50-path: ${ONNX_RESNET50_PATH:./data/models/resnet50/model.onnx}
      clip-vocab-path: ${ONNX_CLIP_VOCAB_PATH:./data/models/clip-vit-base-patch32/vocab.json}
      clip-merges-path: ${ONNX_CLIP_MERGES_PATH:./data/models/clip-vit-base-patch32/merges.txt}
      clip-enabled: ${ONNX_CLIP_ENABLED:true}
      yolo-path: ${ONNX_YOLO_PATH:./data/models/yolov8n/model.onnx}
      yolo-enabled: ${ONNX_YOLO_ENABLED:true}
      yolo-confidence: ${ONNX_YOLO_CONF:0.25}
      yolo-iou: ${ONNX_YOLO_IOU:0.45}
      top-k: ${ONNX_VISION_TOPK:5}
      threads: ${ONNX_VISION_THREADS:4}
      # V7.2: 音频 (Whisper + Silero VAD)
      silero-vad-path: ${ONNX_SILERO_VAD_PATH:./data/models/silero-vad/model.onnx}
      silero-vad-threshold: ${ONNX_SILERO_VAD_THRESH:0.5}
      silero-vad-chunk: ${ONNX_SILERO_VAD_CHUNK:512}
      whisper-path: ${ONNX_WHISPER_PATH:./data/models/whisper-tiny/decoder.onnx}
      whisper-tokenizer: ${ONNX_WHISPER_TOKENIZER:./data/models/whisper-tiny/tokenizer.json}
      whisper-max-tokens: ${ONNX_WHISPER_MAX_TOKENS:200}
      # V7.3: 视频
      video-fps: ${ONNX_VIDEO_FPS:1.0}
      video-max-frames: ${ONNX_VIDEO_MAX_FRAMES:30}
      video-tmp-dir: ${ONNX_VIDEO_TMP_DIR:/tmp/minimax-video}
      # V7.4: LLM 升级 (BGE embedding + Qwen2.5 chat)
      bge-path: ${ONNX_BGE_PATH:./data/models/bge-small-zh-v15/model.onnx}
      bge-vocab: ${ONNX_BGE_VOCAB:./data/models/bge-small-zh-v15/vocab.txt}
      bge-max-len: ${ONNX_BGE_MAX_LEN:512}
      qwen-path: ${ONNX_QWEN_PATH:./data/models/qwen2.5-0.5b-instruct/model_quantized.onnx}
      qwen-tokenizer: ${ONNX_QWEN_TOKENIZER:./data/models/qwen2.5-0.5b-instruct/tokenizer.json}
      qwen-config: ${ONNX_QWEN_CONFIG:./data/models/qwen2.5-0.5b-instruct/config.json}
      qwen-max-tokens: ${ONNX_QWEN_MAX_TOKENS:512}
      qwen-max-context: ${ONNX_QWEN_MAX_CTX:2048}

    # ── V3.5.15+: 4 模型加权投票权重 ──
    intent:
      weight:
        tf: ${INTENT_W_TF:0.4}            # 关键词 TF
        ngram: ${INTENT_W_NGRAM:0.3}      # Bigram 搭配
        synonym: ${INTENT_W_SYNONYM:0.2}  # 同义词扩展
        context: ${INTENT_W_CONTEXT:0.1}  # 上下文继承
      cache-size: ${INTENT_CACHE:1000}    # LRU 缓存条数

# 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# 临时关闭 SQL 自动配置 (本服务不用 DB)
# spring.autoconfigure.exclude:
#   - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#   - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
#   - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

# 数据源说明: 默认 dev profile  使用 H2, 生产/主模式使用 MySQL
# 详见 application-dev.yml (H2) / application-standalone.yml (MariaDB)
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.minimax.ai: INFO
    org.springframework: WARN

knife4j:
  enable: true
  setting:
    language: zh_cn

# V3.5.90+ OpenTelemetry trace (W3C traceparent, OTLP → collector → jaeger)
# jvm-env (docker-compose) 注入 OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
otel:
  metrics:
    export:
      interval: 30s
  java:
    global-autoconfigure:
      enabled: true

# =============================================================
# V5.7 Nacos 服务发现 (注册当前微服务, gateway 通过 lb:// 调用)
# =============================================================
spring.cloud.nacos:
  discovery:
    server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
    namespace: ${NACOS_NS:minimax-dev}
    username: ${NACOS_USER}
    password: ${NACOS_PASS}
    register-enabled: true
    metadata:
      version: 5.7.0
      group: minimax
